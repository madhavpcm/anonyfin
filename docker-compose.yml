  vpn:
    image: ghcr.io/thrnz/docker-wireguard-pia:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - LOC=sg
      - USER=${PIA_USER}
      - PASS=${PIA_PASS}
      - LOCAL_NETWORK=${LOCAL_NETWORK}
      - PORT_FORWARDING=1
      - PORT_SCRIPT=/pia-shared/portupdate-qbittorrent.sh
      - FIREWALL=0
      - RECONNECT=1
      - TZ=${TIMEZONE}
      - QBT_USER=${QBT_USER}
      - QBT_PASS=${QBT_PASS}
    volumes:
      - ./pia:/pia
      - ./pia-shared:/pia-shared
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    networks: 
    - vpn_net
    ports:
      - "8080:8080"
      - "51697:51697/tcp"
      - "51697:51697/udp"
      - "9000:9000" # Maps the exporter's port to your host

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:libtorrentv1
    container_name: qbittorrent
    cap_add:
      - SYS_ADMIN
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - WEBUI_PORT=8080
      - TORRENT_PORT=51697
    volumes:
      - ./qbittorrent:/config
      - ${MEDIA_ROOT}:/data
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    restart: unless-stopped

  qbittorrent-exporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:latest
    container_name: qbittorrent-exporter
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      # qBittorrent Connection Settings
      - QBITTORRENT_HOST=127.0.0.1
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=${QBT_USER}
      - QBITTORRENT_PASS=${QBT_PASS}
      - QBITTORRENT_SSL=False # Set to True if using HTTPS
      # Optional Exporter Settings
      - EXPORTER_PORT=9000
      - EXPORTER_LOG_LEVEL=ERROR

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    cap_add:
      - SYS_ADMIN
    environment:
      - PODMAN_USERNS=keep-id
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ./jellyfin:/config
      - ${MEDIA_ROOT}:/data:z
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    restart: unless-stopped
    networks:
      - jellyfin_net
      - vpn_net

networks:
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
  jellyfin_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
